<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&display=swap">
  <link rel="stylesheet" type="text/css" href="resources/css/style.css">
 </head>
<body>
<header class="header">
    <h1 class="header--main">My Library</h1>
    <p class="header--flourish" aria-hidden="true">❦</p>
    <p class="header--sub-header" id="stats"></p>
    <p class="sync" id="sync" hidden>
        <span id="sync-status"></span>
        <button class="button button--link" id="sync-signin" type="button">Sign in to sync</button>
        <button class="button button--link" id="sync-signout" type="button" hidden>Sign out</button>
    </p>
</header>

<section class="toolbar">
    <div class="tabs" role="tablist">
        <button class="tab tab--active" data-shelf="all">All</button>
        <button class="tab" data-shelf="reading">Reading</button>
        <button class="tab" data-shelf="want">Want to read</button>
        <button class="tab" data-shelf="read">Read</button>
    </div>
    <div class="controls">
        <input class="input" id="filter" type="search" placeholder="Filter by title or author">
        <select class="input" id="sort">
            <option value="added">Recently added</option>
            <option value="title">Title</option>
            <option value="author">Author</option>
            <option value="rating">Rating</option>
        </select>
        <button class="button button--primary" id="add-book">+ Add book</button>
    </div>
</section>

<main id="bookcase" class="bookcase"></main>
<p class="empty" id="empty" hidden>No books here yet. Click <strong>+ Add book</strong> to start your shelf.</p>

<footer class="footer">
    <button class="button button--link" id="export">Export library</button>
    <label class="button button--link">Import library<input type="file" id="import" accept="application/json" hidden></label>
</footer>

<!-- Add / edit dialog -->
<dialog class="dialog" id="book-dialog">
    <form method="dialog" id="book-form">
        <div class="dialog__head">
            <h2 class="header--secondary" id="dialog-title">Add a book</h2>
            <img class="dialog__cover" id="dialog-cover" alt="Cover" hidden>
        </div>

        <div class="lookup">
            <input class="input" id="lookup-query" type="search" placeholder="Search Open Library to auto-fill...">
            <button class="button" type="button" id="lookup-btn">Search</button>
        </div>
        <ul class="lookup__results" id="lookup-results"></ul>

        <div class="field-row">
            <label class="field">ISBN <input class="input" name="isbn" inputmode="numeric" placeholder="Fills in details &amp; exact cover"></label>
            <label class="field">Format
                <select class="input" name="format">
                    <option value="hardcover">Hardcover</option>
                    <option value="paperback">Paperback</option>
                    <option value="kindle">Kindle</option>
                </select>
            </label>
        </div>
        <label class="field">Title <input class="input" name="title" required></label>
        <label class="field">Author <input class="input" name="author"></label>
        <label class="field">Cover image URL <input class="input" name="cover" type="url"></label>
        <div class="field spine-field">
            <span>Spine photo</span>
            <div class="spine-field__row">
                <img class="spine-field__preview" id="spine-preview" alt="Spine photo" hidden>
                <label class="button" for="spine-file" id="spine-choose">Choose photo</label>
                <input type="file" id="spine-file" accept="image/*" hidden>
                <button class="button" type="button" id="spine-remove" hidden>Remove</button>
                <small class="spine-field__hint">A photo of the book's spine makes the shelf show your exact copy.</small>
            </div>
            <input type="hidden" name="spine">
            <input type="hidden" name="spineRatio">
        </div>
        <div class="field-row">
            <label class="field">Shelf
                <select class="input" name="status">
                    <option value="want">Want to read</option>
                    <option value="reading">Reading</option>
                    <option value="read">Read</option>
                </select>
            </label>
            <label class="field">Rating
                <select class="input" name="rating">
                    <option value="0">—</option>
                    <option value="1">★</option>
                    <option value="2">★★</option>
                    <option value="3">★★★</option>
                    <option value="4">★★★★</option>
                    <option value="5">★★★★★</option>
                </select>
            </label>
        </div>
        <label class="field">Notes <textarea class="input" name="notes" rows="3"></textarea></label>

        <div class="dialog__actions">
            <button class="button button--danger" type="button" id="delete-book" hidden>Delete</button>
            <span class="spacer"></span>
            <button class="button" value="cancel" formnovalidate>Cancel</button>
            <button class="button button--primary" value="save">Save</button>
        </div>
    </form>
</dialog>

<!-- Sign-in for syncing across devices -->
<dialog class="dialog" id="sync-dialog">
    <form id="sync-form">
        <h2 class="header--secondary">Sync your library</h2>
        <p class="sync-dialog__text" id="sync-intro">Enter your email. We'll send a sign-in link and a 6-digit code.</p>
        <label class="field" id="sync-email-field">Email <input class="input" id="sync-email" type="email" autocomplete="email" required></label>
        <label class="field" id="sync-code-field" hidden>Code from the email <input class="input" id="sync-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></label>
        <p class="sync-dialog__error" id="sync-error" hidden></p>
        <div class="dialog__actions">
            <span class="spacer"></span>
            <button class="button" type="button" id="sync-cancel">Cancel</button>
            <button class="button button--primary" type="submit" id="sync-submit">Send code</button>
        </div>
    </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="resources/js/config.js"></script>
<script src="resources/js/books.js"></script>
<script src="resources/js/app.js"></script>
<script src="resources/js/sync.js"></script>
</body>
</html>
